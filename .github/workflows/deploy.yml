name: 🚀 Deploy Portofolio

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-portofolio
  cancel-in-progress: true

env:
  DEPLOY_PATH: /home/rizal/portofolio

jobs:
  deploy:
    name: Deploy to Server via Cloudflare Tunnel
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: 🔑 Setup SSH via Tunnel
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<'EOF'
          Host deploy-target
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 20
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: 🔎 Test Connection
        run: |
          ssh deploy-target "echo 'Connected to' \$(hostname) as \$(whoami)"

      - name: ✅ Verify deploy script
        run: |
          ssh deploy-target \
            "test -x $DEPLOY_PATH/deploy.sh || { echo 'deploy.sh not found or not executable at $DEPLOY_PATH'; exit 1; }"

      - name: 🚀 Deploy
        run: |
          ssh deploy-target "bash -x $DEPLOY_PATH/deploy.sh"

      - name: ✅ Notify Success
        if: success()
        run: |
          {
            echo "## ✅ Deploy Portofolio Berhasil"
            echo "Server: \`${{ secrets.SSH_HOST }}\`"
            echo "Commit: \`${{ github.sha }}\`"
            echo "Waktu: $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"