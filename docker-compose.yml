services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: portofolio-frontend:latest
    container_name: portfolio-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - portfolio-network

networks:
  portfolio-network:
    name: portofolio_portfolio-network
    driver: bridge
