server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Register WebAssembly MIME type for Rapier 3D physics
    types {
        application/wasm wasm;
    }

    # Use Docker internal DNS for dynamic resolution
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:3000;

    # Backend API proxy
    location /api/ {
        proxy_pass $backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 5s;
    }

    # React SPA — all non-file routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (including WASM) aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/wasm;
    gzip_min_length 1000;
}
